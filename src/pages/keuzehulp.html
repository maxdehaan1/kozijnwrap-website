<section class="hero">
  <div class="wrap">
    <span class="tag">Keuzehulp</span>
    <h1>Wat heeft jouw kozijn nodig, en wat kost het?</h1>
    <p class="lede">Vier vragen, en je weet of herstel volstaat, of je beter kunt wrappen, of dat vervangen de enige echte optie is — <b>met meteen een prijsindicatie</b> voor jouw situatie. Je hoeft geen gegevens achter te laten.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="kh" id="kh">

      <noscript>
        <p class="callout">De keuzehulp heeft JavaScript nodig. Geen probleem — dezelfde vragen staan uitgeschreven in het artikel
          <a href="/blog/kozijn-vervangen-of-herstellen">Kozijn vervangen of herstellen?</a></p>
      </noscript>

      <div id="kh-vraag" hidden>
        <p class="kh-progress" id="kh-teller">Vraag 1 van 4</p>
        <div class="kh-bar"><span id="kh-balk" style="width:25%"></span></div>
        <h2 id="kh-titel" tabindex="-1"></h2>
        <p class="kh-hint" id="kh-hint"></p>
        <ul class="kh-options" id="kh-opties"></ul>
        <button class="kh-back" id="kh-terug" type="button" hidden>← Vorige vraag</button>
      </div>

      <div id="kh-uitkomst" hidden aria-live="polite"></div>

    </div>
  </div>
</section>

<script>
(function () {
  "use strict";

  var OFFERTE = "https://iwrap.nl/contact/?utm_source=kozijnwrap.nl&utm_medium=keuzehulp&utm_campaign=";

  var STAPPEN = {
    materiaal: {
      vraag: "Waarvan is je kozijn gemaakt?",
      hint: "Kunststof voelt glad en licht aan, aluminium hard en koud. Twijfel je? Kies dan &lsquo;weet ik niet&rsquo; — dan lopen we gewoon door.",
      opties: [
        { label: "Kunststof", sub: "de meest voorkomende soort bij woningen van na 1980", next: "sluiting" },
        { label: "Aluminium", sub: "vaak bij nieuwbouw, bedrijfspanden en schuifpuien", uitkomst: "aluminium" },
        { label: "Hout", sub: "geschilderd, met zichtbare houtnerf in het profiel zelf", uitkomst: "hout" },
        { label: "Weet ik niet", sub: "geen probleem, we gaan verder met de volgende vraag", next: "sluiting" }
      ]
    },
    sluiting: {
      vraag: "Sluit het raam of de deur nog goed?",
      hint: "Dit is de belangrijkste vraag van de vier. Tocht of klemmen wijst op het profiel of het hang- en sluitwerk — en dat los je niet op met een nieuwe toplaag.",
      opties: [
        { label: "Ja, het sluit prima", sub: "geen tocht, klemt niet, geen zichtbare kieren", next: "schade" },
        { label: "Nee, het tocht of klemt", sub: "of er zitten kieren, of het raam sluit niet meer goed aan", uitkomst: "vervangen" }
      ]
    },
    schade: {
      vraag: "Wat zie je aan het kozijn?",
      hint: "Kijk vooral naar de hoeken, de randen en de zonkant — daar begint het altijd.",
      opties: [
        { label: "De kleur is vervaagd, dof of vergeeld", sub: "vaak duidelijk verschil tussen de zon- en de schaduwkant", next: "omvang" },
        { label: "De folie laat los of bladdert", sub: "meestal het eerst op hoeken en profielranden", next: "omvang" },
        { label: "Krassen of stootschade in de toplaag", sub: "het profiel eronder is nog heel", next: "omvang" },
        { label: "Niets, het ziet er nog goed uit", sub: "ik wil puur een andere kleur of uitstraling", uitkomst: "wrappen" }
      ]
    },
    omvang: {
      vraag: "Om hoeveel gaat het?",
      hint: "Dit bepaalt niet óf het kan, maar wel wat het ongeveer kost — je krijgt er meteen een bedrag bij.",
      opties: [
        { label: "Een paar dorpels of losse delen", sub: "bijvoorbeeld alleen de onderdorpels aan de zonkant", uitkomst: "herstel", omvang: "klein" },
        { label: "Een paar kozijnen", sub: "de kozijnen aan één gevel of verdieping", uitkomst: "herstel", omvang: "middel" },
        { label: "De hele woning", sub: "alle kozijnen in één keer", uitkomst: "herstel", omvang: "groot" },
        { label: "Meerdere panden", sub: "een VvE, een complex of een woningcorporatie", uitkomst: "herstel", omvang: "zakelijk" }
      ]
    }
  };

  var PRIJS = {
    klein:    "Een paar dorpels ligt meestal rond de €500.",
    middel:   "Voor een deel van een woning ligt het doorgaans tussen de €500 en €3.000.",
    groot:    "Voor een hele woning ligt het doorgaans tussen de €500 en €3.000, afhankelijk van het aantal kozijnen en de afmetingen.",
    zakelijk: "Bij meerdere panden hangt de prijs sterk af van de omvang — dat vraagt om een opname ter plaatse."
  };

  var UITKOMSTEN = {
    herstel: {
      type: "go",
      verdict: "Folieherstel",
      titel: "Je kozijn is nog goed — alleen de toplaag is op",
      tekst: "Het profiel sluit nog goed en is technisch in orde. Wat je ziet is de folie: die veroudert door zon en weer, terwijl het kozijn eronder nog decennia meegaat. Die laag vervangen is een fractie van de kosten van een nieuw kozijn, en het is in een of twee dagen gebeurd.",
      cta: "Offerte aanvragen bij iWrap",
      ctaHref: OFFERTE + "herstel",
      ctaHint: "Je kunt bij de aanvraag meteen foto&rsquo;s meesturen, dan weet je snel waar je aan toe bent.",
      tweede: { label: "Lees eerst hoe herstel werkt", href: "/kozijnherstel" }
    },
    wrappen: {
      type: "stop",
      verdict: "Kozijnwrappen",
      titel: "Dit is een stijlkeuze, geen herstelvraag",
      tekst: "Er is niets mis met je kozijn — je wilt een andere kleur of uitstraling. Dat heet wrappen, en dat is ander werk dan herstel. <b>Wij voeren wrappen zelf niet uit</b>, dus we sturen je liever eerlijk door dan dat we doen alsof. Op de wrappen-pagina staat waar je op moet letten bij het kiezen van een partij.",
      cta: "Waar je op moet letten bij wrappen",
      ctaHref: "/kozijnwrappen",
      tweede: { label: "Wrappen of schilderen?", href: "/blog/kozijn-wrappen-of-schilderen" }
    },
    vervangen: {
      type: "stop",
      verdict: "Vervangen",
      titel: "Hier lost nieuwe folie je probleem niet mee op",
      tekst: "Tocht, klemmen of kieren betekent dat het probleem in het profiel zelf zit, of in het hang- en sluitwerk. Een nieuwe toplaag maakt het kozijn mooier, maar verandert daar niets aan — en dan heb je over twee jaar hetzelfde probleem plus de kosten van het foliewerk. Hiervoor moet je bij een kozijnleverancier zijn.",
      prijs: "Een kunststof kozijn vervangen kost doorgaans €800 tot €2.500 per stuk, afhankelijk van afmeting, glassoort en montage.",
      tweede: { label: "Lees de volledige afweging", href: "/blog/kozijn-vervangen-of-herstellen" }
    },
    hout: {
      type: "stop",
      verdict: "Houten kozijn",
      titel: "Houten kozijnen worden geschilderd, niet gefolied",
      tekst: "Folie hoort op kunststof en aluminium. Een houten kozijn heeft schilderwerk nodig, en bij houtrot eerst houtherstel. Een schilder of houtrotspecialist is hier het juiste adres.",
      tweede: { label: "Terug naar het overzicht", href: "/" }
    },
    aluminium: {
      type: "stop",
      verdict: "Aluminium kozijn",
      titel: "Bij aluminium gaat het om de coating, niet om folie",
      tekst: "Aluminium kozijnen hebben een gemoffelde fabriekscoating in plaats van een folielaag. Verweert die, dan is spuiten of wrappen de route — niet folieherstel. <b>Wij werken uitsluitend met kunststof kozijnen</b>, dus hiervoor kunnen we je niet helpen.",
      cta: "Lees meer over wrappen op aluminium",
      ctaHref: "/kozijnwrappen",
      tweede: { label: "Terug naar het overzicht", href: "/" }
    }
  };

  var VOLGORDE = ["materiaal", "sluiting", "schade", "omvang"];

  var elVraag = document.getElementById("kh-vraag");
  var elUit = document.getElementById("kh-uitkomst");
  var elTitel = document.getElementById("kh-titel");
  var elHint = document.getElementById("kh-hint");
  var elOpties = document.getElementById("kh-opties");
  var elTeller = document.getElementById("kh-teller");
  var elBalk = document.getElementById("kh-balk");
  var elTerug = document.getElementById("kh-terug");

  var pad = [];

  function toonVraag(id, verplaatsFocus) {
    var stap = STAPPEN[id];
    var nr = VOLGORDE.indexOf(id) + 1;

    elTeller.textContent = "Vraag " + nr + " van " + VOLGORDE.length;
    elBalk.style.width = (nr / VOLGORDE.length) * 100 + "%";
    elTitel.textContent = stap.vraag;
    elHint.innerHTML = stap.hint;
    elOpties.innerHTML = "";

    stap.opties.forEach(function (opt) {
      var li = document.createElement("li");
      var knop = document.createElement("button");
      knop.type = "button";
      knop.className = "kh-opt";
      knop.innerHTML = '<span class="kh-mark" aria-hidden="true"></span><span><b>' +
        opt.label + "</b><small>" + opt.sub + "</small></span>";
      knop.addEventListener("click", function () {
        pad.push(id);
        if (opt.uitkomst) toonUitkomst(opt.uitkomst, opt.omvang);
        else toonVraag(opt.next, true);
      });
      li.appendChild(knop);
      elOpties.appendChild(li);
    });

    elTerug.hidden = pad.length === 0;
    elUit.hidden = true;
    elVraag.hidden = false;
    if (verplaatsFocus) elTitel.focus();
  }

  function toonUitkomst(naam, omvang) {
    var u = UITKOMSTEN[naam];
    var html = '<div class="kh-result ' + u.type + '">' +
      '<span class="kh-verdict">' + u.verdict + "</span>" +
      "<h2 tabindex=\"-1\" id=\"kh-uitkomst-titel\">" + u.titel + "</h2>" +
      "<p>" + u.tekst + "</p>";

    var bedrag = (omvang && PRIJS[omvang]) || u.prijs;
    if (bedrag) {
      html += '<div class="kh-prijsblok">' +
        '<span class="kh-prijslabel">Prijsindicatie</span>' +
        '<p class="kh-price">' + bedrag + "</p>" +
        '<p class="kh-hint">Een vast bedrag bestaat niet — afmetingen, bereikbaarheid en de staat van de oude folie bepalen mee. ' +
        '<a href="/blog/kozijnherstel-kosten">Zo is de prijs opgebouwd.</a></p></div>';
    }

    html += '<div class="kh-actions">';
    if (u.cta) html += '<a class="kh-cta" href="' + u.ctaHref + '">' + u.cta + " →</a>";
    if (u.tweede) html += '<a class="kh-cta ghost" href="' + u.tweede.href + '">' + u.tweede.label + "</a>";
    html += "</div>";

    if (u.ctaHint) html += '<p class="kh-hint" style="margin:14px 0 0;">' + u.ctaHint + "</p>";
    html += "</div>" +
      '<p class="kh-restart">Klopt dit niet met wat je ziet? <button type="button" id="kh-opnieuw">Begin opnieuw</button></p>';

    elUit.innerHTML = html;
    elVraag.hidden = true;
    elUit.hidden = false;
    document.getElementById("kh-uitkomst-titel").focus();
    document.getElementById("kh-opnieuw").addEventListener("click", start);
  }

  function start() {
    pad = [];
    toonVraag("materiaal", false);
  }

  elTerug.addEventListener("click", function () {
    var vorige = pad.pop();
    if (vorige) toonVraag(vorige, true);
  });

  start();
})();
</script>
